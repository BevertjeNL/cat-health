name: One-time Supabase to Neon migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_CATHEALTH_TO_NEON
        required: true

jobs:
  migrate:
    if: inputs.confirmation == 'MIGRATE_CATHEALTH_TO_NEON'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1

      - name: Link the source project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Export the public data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db dump --linked --data-only --schema public --use-copy --file /tmp/cathealth-data.sql

      - name: Export the legacy owner map
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          jq -n '{query: "select id::text as old_user_id, email from auth.users where email is not null order by id", read_only: true}' > /tmp/query.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            > /tmp/legacy-users.json
          jq -r '(if type == "array" then . else .result end)[] | [.old_user_id, .email] | @tsv' /tmp/legacy-users.json > /tmp/legacy-users.tsv
          test -s /tmp/legacy-users.tsv

          counts_sql="
          select * from (
            select 'blood_values' as table_name, count(*)::bigint as row_count from public.blood_values
            union all select 'food_catalog', count(*) from public.food_catalog
            union all select 'food_purchases', count(*) from public.food_purchases
            union all select 'medication_catalog', count(*) from public.medication_catalog
            union all select 'medications', count(*) from public.medications
            union all select 'pets', count(*) from public.pets
            union all select 'symptom_logs', count(*) from public.symptom_logs
            union all select 'vaccinations', count(*) from public.vaccinations
            union all select 'veterinarians', count(*) from public.veterinarians
            union all select 'vet_visits', count(*) from public.vet_visits
            union all select 'weight_measurements', count(*) from public.weight_measurements
          ) counts order by table_name
          "
          jq -n --arg query "$counts_sql" '{query: $query, read_only: true}' > /tmp/count-query.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/count-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            > /tmp/source-counts.json
          jq -r '(if type == "array" then . else .result end)[] | [.table_name, .row_count] | @tsv' /tmp/source-counts.json > /tmp/source-counts.tsv

      - name: Refuse a non-empty Neon target
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          existing=$(psql "$NEON_DATABASE_URL" --tuples-only --no-align --command="select case when to_regclass('public.pets') is null then 0 else (select count(*) from public.pets) end")
          test "$existing" = "0"

      - name: Apply schema and import data
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --file neon/migrations/0001_initial_schema.sql
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --single-transaction --file /tmp/cathealth-data.sql
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          \copy cathealth_migration.legacy_users(old_user_id, email) from '/tmp/legacy-users.tsv' with (format csv, delimiter E'\t')
          update public.pets as p
             set user_id = u.id::text
            from cathealth_migration.legacy_users as legacy
            join neon_auth."user" as u on lower(u.email) = lower(legacy.email)
           where p.user_id = legacy.old_user_id;
          SQL

      - name: Verify imported row counts
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align --field-separator=$'\t' > /tmp/target-counts.tsv <<'SQL'
          select * from (
            select 'blood_values' as table_name, count(*)::bigint as row_count from public.blood_values
            union all select 'food_catalog', count(*) from public.food_catalog
            union all select 'food_purchases', count(*) from public.food_purchases
            union all select 'medication_catalog', count(*) from public.medication_catalog
            union all select 'medications', count(*) from public.medications
            union all select 'pets', count(*) from public.pets
            union all select 'symptom_logs', count(*) from public.symptom_logs
            union all select 'vaccinations', count(*) from public.vaccinations
            union all select 'veterinarians', count(*) from public.veterinarians
            union all select 'vet_visits', count(*) from public.vet_visits
            union all select 'weight_measurements', count(*) from public.weight_measurements
          ) counts order by table_name;
          SQL
          diff --unified /tmp/source-counts.tsv /tmp/target-counts.tsv
          awk -F '\t' '{ total += $2 } END { print "Verified " total " rows across " NR " tables" }' /tmp/target-counts.tsv
